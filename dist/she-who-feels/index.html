    const galleryImages = document.querySelectorAll('.gallery-image')

    const render = () => {

      if (modalDescription) {
        modalDescription.textContent = images[currentIndex].description

    const openModalAt = (idx) => {
      currentIndex = idx
      render()
      modal.classList.add('open')

    const closeModal = () => {
      modal.classList.remove('open')
      document.body.style.overflow = ''

    const prev = () => {

      render()

      currentIndex = (currentIndex + 1) % images.length

    }

    const setNavVisibility = () => {

      modalNext.style.display = show ? '' : 'none'
    }

    galleryImages.forEach((img) => {
      img.addEventListener('click', () => {
        const imageIndex = parseInt(img.getAttribute('data-image-index') || '0')
        openModalAt(imageIndex)
      })
    })

    modalClose?.addEventListener('click', closeModal)

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal()
    })

    modalPrev?.addEventListener('click', prev)

    document.addEventListener('keydown', (e) => {

      if (e.key === 'ArrowLeft') prev()
      if (e.key === 'ArrowRight') next()
    })

    const onTouchStart = (e) => {
      if (!modal.classList.contains('open')) return
      const t = e.touches[0]
      startX = t.clientX
      startY = t.clientY
      isSwiping = true

    const onTouchMove = (e) => {

      if (Math.abs(dy) > Math.abs(dx)) return

      if (Math.abs(dx) < 60) return

      if (dx > 0) prev()
      else next()
    }

    modal.addEventListener('touchstart', onTouchStart, { passive: true })

    modal.addEventListener('touchend', onTouchEnd, { passive: true })
  })
